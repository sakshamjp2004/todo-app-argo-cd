kind: Application
apiVersion: argoproj.io/v1alpha1
metadata:
  name: notes-app
  metadata: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shamrock2004/todo-app-argo-cd.git
    targetRevision: main
    path: manifests/
  destination:
    server: https://64D8013752ADC6ACE84940F256BDABEA.gr7.us-east-1.eks.amazonaws.com
    namespace: notes-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOption:
      - createNamespace=true
