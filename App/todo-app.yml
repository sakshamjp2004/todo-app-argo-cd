kind: Application
apiVersion: argoproj.io/v1alpha1
metadata:
  name: todo-app1
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sakshamjp2004/todo-app-argo-cd.git
    targetRevision: main
    path: manifests/
  destination:
    server: https://kubernetes.default.svc
    namespace: todo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
